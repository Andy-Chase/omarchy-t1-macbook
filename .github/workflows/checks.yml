name: Offline source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  userspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libdrm-dev python3
      - name: Build and test userspace
        run: make test-full
      - name: Make source archive
        run: make archive
